
name: Build Pirate LLM Server IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install CMake
        run: |
          brew install cmake

      - name: Build llama.cpp framework
        run: |
          chmod +x setup.sh build-llama.sh
          ./setup.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project LLMServer.xcodeproj \
            -scheme LLMServer

      - name: Archive iOS app
        run: |
          xcodebuild \
            -project LLMServer.xcodeproj \
            -scheme LLMServer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Pirate.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/Pirate.xcarchive/Products/Applications/LLMServer.app" \
            Payload/

          zip -qr PirateLLM-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PirateLLM-unsigned-IPA
          path: PirateLLM-unsigned.ipa
          retention-days: 7
